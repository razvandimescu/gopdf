name: Release Fractal

# On a published release, attach a deterministic "release fingerprint" fractal + stats to
# the notes (image hosted on a release-fractals orphan branch). Releases here are created
# manually, so the release event fires normally (no goreleaser/GITHUB_TOKEN chaining needed).
#
# changelog: keep -> the fractal decorates gopdf's own hand-written notes + GitHub's PR list
# rather than generating a mechanical commit-subject list. No classifier, no LLM download.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  fractal:
    uses: razvandimescu/fractal-of-the-day/.github/workflows/release-fractal.reusable.yml@main
    with:
      changelog: keep
